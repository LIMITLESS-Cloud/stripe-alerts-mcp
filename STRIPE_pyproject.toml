[project]
name = "stripe-alerts-mcp"
version = "1.0.0"
description = "Stripe business intelligence MCP server — failed payments, MRR tracking, subscription changes, and revenue snapshots for AI assistants."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Patrick Suen", email = "hello@limitless-automation.com"}
]
keywords = ["mcp", "stripe", "business-alerts", "mrr", "payments", "saas", "revenue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/limitless-automation/stripe-alerts-mcp"
Issues = "https://github.com/limitless-automation/stripe-alerts-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
